services:
  - type: web
    name: trivia-happy-hour-game
    runtime: node
    plan: starter
    buildCommand: npm install && npm --prefix client install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trivia-happy-hour-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: trivia-happy-hour-db
    plan: basic-256mb
